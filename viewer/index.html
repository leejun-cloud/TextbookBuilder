<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TextbookBuilder 뷰어</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --accent: #3a6df0;
    --green: #1e8e4a;
    --blue: #2563eb;
    --amber: #b7791f;
    --gray: #8a8a8f;
    --red: #d0342c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text);
  }
  #app { display: flex; height: 100vh; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 260px; flex: none; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #sidebar h1 {
    font-size: 15px; padding: 16px 16px 8px; margin: 0; color: var(--text);
  }
  #project-select {
    margin: 0 16px 12px; padding: 6px 8px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 6px; background: white;
  }
  .lesson-list { list-style: none; margin: 0; padding: 0 8px; flex: 1; }
  .lesson-row, .special-row {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 10px; margin-bottom: 2px; border-radius: 8px;
    cursor: pointer; font-size: 13.5px; color: var(--text);
  }
  .lesson-row:hover, .special-row:hover { background: #eef1fb; }
  .lesson-row.active, .special-row.active { background: var(--accent); color: white; }
  .lesson-row.active .badge { color: white; }
  .lesson-nn { font-weight: 600; min-width: 34px; }
  .badge {
    font-size: 11px; padding: 2px 7px; border-radius: 999px; font-weight: 600;
    background: #eee; color: #555;
  }
  .badge.승인 { background: #e3f6e9; color: var(--green); }
  .badge.평가됨 { background: #e6edfd; color: var(--blue); }
  .badge.초안 { background: #fbf0d9; color: var(--amber); }
  .badge.입력만 { background: #eee; color: var(--gray); }
  .badge.미시작 { background: #f1f1f2; color: var(--gray); }
  .lesson-row.active .badge { background: rgba(255,255,255,.25); color: white; }
  .score { font-size: 11.5px; color: var(--muted); margin-left: auto; }
  .lesson-row.active .score { color: rgba(255,255,255,.85); }

  /* ---------- Main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .tabs { display: flex; gap: 4px; }
  .tab-btn {
    border: none; background: transparent; padding: 8px 14px; border-radius: 6px;
    font-size: 13.5px; cursor: pointer; color: var(--muted);
  }
  .tab-btn.active { background: var(--accent); color: white; }
  #print-toggle {
    margin-left: auto; border: 1px solid var(--border); background: white;
    padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  #print-toggle.active { background: var(--text); color: white; }

  #gauge-wrap { padding: 10px 24px 0; background: var(--panel); }
  #gauge-label { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  #gauge-bar-bg { height: 6px; border-radius: 3px; background: #eee; overflow: hidden; }
  #gauge-bar-fill { height: 100%; border-radius: 3px; transition: width .2s; }

  #content-scroll { flex: 1; overflow-y: auto; padding: 24px; }
  #content {
    max-width: 780px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 40px;
    line-height: 1.75; font-size: 15px;
  }
  #content.print-mode {
    width: 21cm; max-width: 21cm; min-height: 29.7cm; padding: 2cm;
    box-shadow: 0 0 0 1px var(--border), 0 4px 24px rgba(0,0,0,.08);
  }
  #content h1 { font-size: 22px; margin: 0 0 16px; }
  #content h2 { font-size: 18px; margin: 28px 0 12px; }
  #content h3 { font-size: 15.5px; margin: 22px 0 10px; }
  #content p { margin: 0 0 14px; }
  #content ul, #content ol { margin: 0 0 14px; padding-left: 22px; }
  #content li { margin-bottom: 4px; }
  #content blockquote {
    margin: 0 0 14px; padding: 8px 14px; border-left: 3px solid var(--accent);
    background: #f5f7fe; color: #444; font-size: 14px;
  }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  #content code {
    background: #f1f1f3; padding: 1px 5px; border-radius: 4px; font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #content table { border-collapse: collapse; width: 100%; margin: 0 0 16px; font-size: 13.5px; }
  #content th, #content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  #content th { background: #f4f5f7; }
  .empty-state { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }

  @media print {
    #sidebar, #topbar, #gauge-wrap { display: none !important; }
    #content-scroll { padding: 0; overflow: visible; }
    #content, #content.print-mode {
      box-shadow: none; border: none; width: auto; max-width: none; margin: 0; padding: 0;
    }
  }

  /* ---------- Feedback ---------- */
  #sel-btn {
    position: absolute; display: none; z-index: 50;
    background: var(--text); color: white; border: none; border-radius: 6px;
    padding: 7px 12px; font-size: 12.5px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }
  #fb-dialog-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 100;
    align-items: center; justify-content: center;
  }
  #fb-dialog {
    background: white; width: 420px; border-radius: 10px; padding: 20px; font-size: 13.5px;
  }
  #fb-dialog h3 { margin: 0 0 10px; font-size: 15px; }
  #fb-dialog blockquote {
    margin: 0 0 12px; padding: 8px 12px; background: #f5f5f7; border-left: 3px solid var(--accent);
    max-height: 100px; overflow-y: auto; color: #444;
  }
  #fb-dialog textarea {
    width: 100%; height: 80px; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; font-size: 13px; font-family: inherit; resize: vertical;
  }
  #fb-dialog .actions { margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px; }
  #fb-dialog button { border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  #fb-cancel { background: #eee; color: #333; }
  #fb-save { background: var(--accent); color: white; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: white; padding: 12px 20px; border-radius: 8px;
    font-size: 13.5px; opacity: 0; transition: all .25s; z-index: 200; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>TextbookBuilder</h1>
    <select id="project-select"></select>
    <ul class="lesson-list" id="lesson-list"></ul>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="tabs" id="tabs">
        <button class="tab-btn" data-tab="draft">본문</button>
        <button class="tab-btn" data-tab="worksheet">활동지</button>
        <button class="tab-btn" data-tab="teacherNotes">교사용</button>
        <button class="tab-btn" data-tab="evaluation">평가</button>
        <button class="tab-btn" data-tab="input">입력</button>
        <button class="tab-btn" data-tab="feedback">피드백</button>
      </div>
      <button id="print-toggle">인쇄 미리보기</button>
    </div>
    <div id="gauge-wrap" style="display:none">
      <div id="gauge-label"></div>
      <div id="gauge-bar-bg"><div id="gauge-bar-fill"></div></div>
    </div>
    <div id="content-scroll"><div id="content"></div></div>
  </div>
</div>

<button id="sel-btn">수정 요청</button>
<div id="fb-dialog-backdrop">
  <div id="fb-dialog">
    <h3>수정 요청</h3>
    <blockquote id="fb-selection"></blockquote>
    <textarea id="fb-comment" placeholder="요청 내용을 입력하세요"></textarea>
    <div class="actions">
      <button id="fb-cancel">취소</button>
      <button id="fb-save">저장</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ---------------- 간단 마크다운 렌더러 ---------------- */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return s;
}
function renderMarkdown(md) {
  if (!md) return "";
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let i = 0;
  let para = [];
  let list = null; // {type: 'ul'|'ol', items: []}

  function flushPara() {
    if (para.length) {
      html += "<p>" + inlineMd(para.join(" ")) + "</p>\n";
      para = [];
    }
  }
  function flushList() {
    if (list) {
      html += `<${list.type}>` + list.items.map(it => `<li>${inlineMd(it)}</li>`).join("") + `</${list.type}>\n`;
      list = null;
    }
  }

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    if (trimmed === "") { flushPara(); flushList(); i++; continue; }

    // horizontal rule
    if (/^(---+|\*\*\*+|___+)$/.test(trimmed)) {
      flushPara(); flushList();
      html += "<hr>\n"; i++; continue;
    }
    // heading
    let m = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (m) {
      flushPara(); flushList();
      const level = Math.min(m[1].length, 3);
      html += `<h${level}>${inlineMd(m[2])}</h${level}>\n`;
      i++; continue;
    }
    // blockquote
    if (trimmed.startsWith(">")) {
      flushPara(); flushList();
      const buf = [];
      while (i < lines.length && lines[i].trim().startsWith(">")) {
        buf.push(lines[i].trim().replace(/^>\s?/, ""));
        i++;
      }
      html += "<blockquote>" + inlineMd(buf.join(" ")) + "</blockquote>\n";
      continue;
    }
    // table (pipe)
    if (trimmed.startsWith("|") && lines[i + 1] && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
      flushPara(); flushList();
      const header = trimmed.split("|").map(c => c.trim()).filter((c, idx, arr) => !(idx === 0 && c === "") && !(idx === arr.length - 1 && c === ""));
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) {
        const cells = lines[i].trim().split("|").map(c => c.trim()).filter((c, idx, arr) => !(idx === 0 && c === "") && !(idx === arr.length - 1 && c === ""));
        rows.push(cells);
        i++;
      }
      html += "<table><thead><tr>" + header.map(h => `<th>${inlineMd(h)}</th>`).join("") + "</tr></thead><tbody>";
      for (const r of rows) {
        html += "<tr>" + r.map(c => `<td>${inlineMd(c)}</td>`).join("") + "</tr>";
      }
      html += "</tbody></table>\n";
      continue;
    }
    // lists
    let ulm = trimmed.match(/^[-*+]\s+(.*)$/);
    let olm = trimmed.match(/^\d+\.\s+(.*)$/);
    if (ulm || olm) {
      flushPara();
      const type = ulm ? "ul" : "ol";
      const text = ulm ? ulm[1] : olm[1];
      if (list && list.type !== type) flushList();
      if (!list) list = { type, items: [] };
      list.items.push(text);
      i++; continue;
    }
    flushList();
    para.push(trimmed);
    i++;
  }
  flushPara(); flushList();
  return html;
}

/* ---------------- State & API ---------------- */
const state = {
  projects: [], project: null, lesson: null,
  lessonData: null, tab: "draft", printMode: false,
  pollTimer: null, lastMtime: null, sourcesFiles: null, sourceContent: {},
};

async function api(path) {
  const res = await fetch(path);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "요청 실패");
  return data;
}
async function apiPost(path, body) {
  const res = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "요청 실패");
  return data;
}

const STATUS_LABELS = ["승인", "평가됨", "초안", "입력만", "미시작"];

function renderSidebar() {
  const sel = document.getElementById("project-select");
  sel.innerHTML = state.projects.map(p => `<option value="${p.id}">${escapeHtml(p.title)}</option>`).join("");
  sel.value = state.project;

  const proj = state.projects.find(p => p.id === state.project);
  const list = document.getElementById("lesson-list");
  let h = "";
  if (proj) {
    for (const l of proj.lessons) {
      const active = (!state.viewingSources && l.nn === state.lesson) ? "active" : "";
      h += `<li class="lesson-row ${active}" data-nn="${l.nn}">
        <span class="lesson-nn">${l.nn}과</span>
        <span class="badge ${l.status}">${l.status}</span>
        ${l.score != null ? `<span class="score">${l.score}점</span>` : ""}
      </li>`;
    }
  }
  const srcActive = state.viewingSources ? "active" : "";
  h += `<li class="special-row ${srcActive}" data-special="sources" style="margin-top:8px;border-top:1px solid var(--border);padding-top:14px;">📁 자료실</li>`;
  list.innerHTML = h;

  list.querySelectorAll(".lesson-row").forEach(row => {
    row.addEventListener("click", () => selectLesson(row.dataset.nn));
  });
  list.querySelectorAll(".special-row").forEach(row => {
    row.addEventListener("click", () => selectSources());
  });
}

async function loadProjects() {
  state.projects = await api("/api/projects");
  if (!state.projects.length) {
    document.getElementById("content").innerHTML = `<div class="empty-state">아직 프로젝트가 없습니다.</div>`;
    return;
  }
  if (!state.project || !state.projects.find(p => p.id === state.project)) {
    state.project = state.projects[0].id;
  }
  renderSidebar();
  const proj = state.projects.find(p => p.id === state.project);
  if (!state.viewingSources) {
    if (!state.lesson && proj.lessons.length) state.lesson = proj.lessons[0].nn;
    if (state.lesson) await selectLesson(state.lesson, true);
    else renderLessonContent();
  }
}

document.getElementById("project-select").addEventListener("change", async (e) => {
  state.project = e.target.value;
  state.lesson = null;
  state.viewingSources = false;
  await loadProjects();
  restartPolling();
});

async function selectLesson(nn, skipRerender) {
  state.viewingSources = false;
  state.lesson = nn;
  document.getElementById("gauge-wrap").style.display = "";
  renderSidebar();
  try {
    state.lessonData = await api(`/api/lesson?project=${encodeURIComponent(state.project)}&nn=${encodeURIComponent(nn)}`);
  } catch (e) {
    state.lessonData = null;
  }
  renderLessonContent();
  restartPolling();
}

async function selectSources() {
  state.viewingSources = true;
  document.getElementById("gauge-wrap").style.display = "none";
  renderSidebar();
  try {
    const res = await api(`/api/sources?project=${encodeURIComponent(state.project)}`);
    state.sourcesFiles = res.files;
  } catch (e) {
    state.sourcesFiles = [];
  }
  renderSourcesView();
  restartPolling();
}

/* ---------------- Tabs & content ---------------- */
document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab-btn");
  if (!btn) return;
  state.tab = btn.dataset.tab;
  renderLessonContent();
});

const TAB_FIELD = { draft: "draft", worksheet: "worksheet", teacherNotes: "teacherNotes", evaluation: "evaluation", input: "input", feedback: "feedback" };
const TAB_EMPTY = {
  draft: "아직 초안이 없습니다 — Claude Code에서 /write-lesson N을 실행하세요.",
  worksheet: "아직 활동지가 없습니다 — Claude Code에서 /write-lesson N을 실행하세요.",
  teacherNotes: "아직 교사용 자료가 없습니다 — Claude Code에서 /write-lesson N을 실행하세요.",
  evaluation: "아직 평가 리포트가 없습니다 — Claude Code에서 /evaluate-lesson N을 실행하세요.",
  input: "아직 입력 자료가 없습니다.",
  feedback: "아직 등록된 피드백이 없습니다. 본문/활동지/교사용 탭에서 텍스트를 드래그해 수정 요청을 남겨보세요.",
};

function renderTabs() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === state.tab);
  });
}

function updateGauge() {
  const wrap = document.getElementById("gauge-wrap");
  if (state.viewingSources || !["draft", "worksheet", "teacherNotes"].includes(state.tab) || !state.lessonData) {
    wrap.style.display = "none";
    return;
  }
  wrap.style.display = "";
  const count = state.lessonData.charCounts[state.tab] || 0;
  const target = state.tab === "draft" ? state.lessonData.target : null;
  const label = document.getElementById("gauge-label");
  const fill = document.getElementById("gauge-bar-fill");
  if (!target) {
    label.textContent = `${count.toLocaleString()}자 / 기준 미설정`;
    fill.style.width = "0%";
    fill.style.background = "var(--gray)";
    return;
  }
  const diffPct = ((count - target) / target) * 100;
  const sign = diffPct >= 0 ? "+" : "";
  label.textContent = `${count.toLocaleString()}자 / 목표 ${target.toLocaleString()}자 (${sign}${diffPct.toFixed(1)}%)`;
  const abs = Math.abs(diffPct);
  let color = "var(--green)";
  if (abs > 20) color = "var(--red)";
  else if (abs > 10) color = "var(--amber)";
  fill.style.background = color;
  fill.style.width = Math.min(100, (count / target) * 100) + "%";
}

function renderLessonContent() {
  renderTabs();
  updateGauge();
  const el = document.getElementById("content");
  el.classList.toggle("print-mode", state.printMode);
  if (!state.lessonData) {
    el.innerHTML = `<div class="empty-state">과 데이터를 불러올 수 없습니다.</div>`;
    return;
  }
  const field = TAB_FIELD[state.tab];
  const text = state.lessonData.files[field];
  if (!text) {
    el.innerHTML = `<div class="empty-state">${TAB_EMPTY[state.tab]}</div>`;
    return;
  }
  el.innerHTML = renderMarkdown(text);
}

function renderSourcesView() {
  const el = document.getElementById("content");
  el.classList.remove("print-mode");
  if (!state.sourcesFiles || !state.sourcesFiles.length) {
    el.innerHTML = `<div class="empty-state">아직 참고 자료가 없습니다.</div>`;
    return;
  }
  el.innerHTML = `<div id="src-list"></div><div id="src-content"></div>`;
  const listEl = document.getElementById("src-list");
  listEl.innerHTML = "<h3>자료 목록</h3><ul>" + state.sourcesFiles.map(f =>
    `<li style="cursor:pointer;color:var(--accent);margin-bottom:6px" data-path="${escapeHtml(f)}">${escapeHtml(f)}</li>`
  ).join("") + "</ul>";
  listEl.querySelectorAll("li").forEach(li => {
    li.addEventListener("click", async () => {
      const path = li.dataset.path;
      try {
        const res = await api(`/api/source?project=${encodeURIComponent(state.project)}&path=${encodeURIComponent(path)}`);
        document.getElementById("src-content").innerHTML = `<hr>` + renderMarkdown(res.content);
      } catch (e) {
        document.getElementById("src-content").innerHTML = `<div class="empty-state">불러오기 실패: ${escapeHtml(e.message)}</div>`;
      }
    });
  });
}

/* ---------------- 인쇄 미리보기 ---------------- */
document.getElementById("print-toggle").addEventListener("click", () => {
  state.printMode = !state.printMode;
  document.getElementById("print-toggle").classList.toggle("active", state.printMode);
  document.getElementById("content").classList.toggle("print-mode", state.printMode);
});

/* ---------------- 선택 피드백 ---------------- */
const FEEDBACK_TABS = ["draft", "worksheet", "teacherNotes"];
let pendingSelection = "";

document.addEventListener("mouseup", () => {
  const selBtn = document.getElementById("sel-btn");
  if (!FEEDBACK_TABS.includes(state.tab) || state.viewingSources) { selBtn.style.display = "none"; return; }
  const sel = window.getSelection();
  const text = sel.toString().trim();
  if (!text || !document.getElementById("content").contains(sel.anchorNode)) {
    selBtn.style.display = "none";
    return;
  }
  const range = sel.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  pendingSelection = text;
  selBtn.style.left = `${rect.left + window.scrollX}px`;
  selBtn.style.top = `${rect.top + window.scrollY - 36}px`;
  selBtn.style.display = "block";
});

document.getElementById("sel-btn").addEventListener("click", () => {
  document.getElementById("sel-btn").style.display = "none";
  document.getElementById("fb-selection").textContent = pendingSelection;
  document.getElementById("fb-comment").value = "";
  document.getElementById("fb-dialog-backdrop").style.display = "flex";
});
document.getElementById("fb-cancel").addEventListener("click", () => {
  document.getElementById("fb-dialog-backdrop").style.display = "none";
});
document.getElementById("fb-save").addEventListener("click", async () => {
  const comment = document.getElementById("fb-comment").value.trim();
  if (!comment) return;
  try {
    await apiPost("/api/feedback", {
      project: state.project, nn: state.lesson, selection: pendingSelection, comment,
    });
    document.getElementById("fb-dialog-backdrop").style.display = "none";
    showToast(`저장됨 — Claude Code에서 '${state.lesson}과 피드백 반영해줘'로 반영하세요`);
    if (state.tab === "feedback") await selectLesson(state.lesson, true);
  } catch (e) {
    showToast("저장 실패: " + e.message);
  }
});

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3200);
}

/* ---------------- 자동 새로고침(폴링) ---------------- */
function restartPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.lastMtime = null;
  state.pollTimer = setInterval(pollOnce, 3000);
}

async function pollOnce() {
  if (!state.project) return;
  try {
    const nn = state.viewingSources ? "" : (state.lesson || "");
    const res = await api(`/api/poll?project=${encodeURIComponent(state.project)}${nn ? "&nn=" + encodeURIComponent(nn) : ""}`);
    if (state.lastMtime !== null && res.mtime !== state.lastMtime) {
      const scroller = document.getElementById("content-scroll");
      const scrollTop = scroller.scrollTop;
      await loadProjects();
      if (state.viewingSources) await selectSources();
      else if (state.lesson) await selectLesson(state.lesson, true);
      scroller.scrollTop = scrollTop;
    }
    state.lastMtime = res.mtime;
  } catch (e) { /* 무시 - 다음 폴링에서 재시도 */ }
}

/* ---------------- init ---------------- */
(async function init() {
  try {
    await loadProjects();
    restartPolling();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="empty-state">불러오기 실패: ${escapeHtml(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
